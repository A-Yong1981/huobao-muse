services:
  app:
    image: huobao/huobao-muse:${HUOBAO_VERSION:-muse-build}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HUOBAO_VERSION: ${HUOBAO_VERSION:-muse-build}
    environment:
      MUSE_MCP_PUBLIC_URL: ${MUSE_MCP_PUBLIC_URL:-https://hb-mcp.aynas.de5.net/mcp}
    expose:
      - "5679"
    volumes:
      - huobao-data:/app/data
      - muse-state:/app/muse-state:ro
    restart: unless-stopped

  web-auth:
    build:
      context: ./web-auth
    environment:
      HUOBAO_UPSTREAM: http://app:5679
      WEB_AUTH_DB: /data/auth.sqlite3
      WEB_AUTH_BOOTSTRAP_HASH: ${WEB_AUTH_BOOTSTRAP_HASH:-}
    ports:
      - "1241:8080"
    volumes:
      - web-auth-data:/data
    depends_on:
      - app
    restart: unless-stopped

  muse-connector:
    build:
      context: ./muse-connector
    environment:
      HUOBAO_API_BASE: ${HUOBAO_API_BASE:-http://app:5679/api/v1}
      MUSE_BRIDGE_TOKEN: ${MUSE_BRIDGE_TOKEN:-}
      ALLOWED_DRAMA_IDS: ${ALLOWED_DRAMA_IDS:-}
      MUSE_STATE_PATH: /data/state.json
    ports:
      - "${MUSE_CONNECTOR_BIND:-127.0.0.1}:5680:5680"
      - "127.0.0.1:18081:5680"
    volumes:
      - muse-state:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  huobao-data:
  muse-state:
  web-auth-data:
